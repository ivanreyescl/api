<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de divisas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="assets/script.js"></script>
</head>
<body class="bg-dark bg-gradient">
    <div class="container mt-5">
        <div class="card mx-auto bg-secondary bg-gradient" style="max-width: 400px;">
            <div class="card-body">
                <h2 class="card-title text-center">Conversor de divisas</h2>
                <div class="form-group ">
                    <label for="clp_amount">Pesos CLP</label>
                    <input id="clp_amount" type="text" class="form-control" placeholder="Ingrese monto CLP">
                </div>
                <div class="form-group">
                    <label for="selector">Moneda a convertir</label>
                    <select id="selector" class="form-control">
                        <option value="dolar">Dolar</option>
                        <option value="euro">Euro</option>
                    </select>
                </div>
                <br>
                <div class="text-center">
                    <button id="convert" class="btn btn-light">Convertir</button>
                </div>
                <div class="mt-3 text-center">
                    <span>Resultado:</span>
                    <span id="api_value" class="font-weight-bold"></span>
                </div>
            </div>
            <div class="mt-4">
                <canvas id="chart" style="width: 100%; height: 400px;"></canvas>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
